<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6257e8" />
    <title>离线 · AI记账</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; margin: 0; padding: 32px 22px; min-height: 100svh; display: grid; place-items: center; background: #faf8f3; color: #28243b; }
      main { width: 100%; max-width: 420px; }
      .brand { display: flex; align-items: center; gap: 9px; font-size: 28px; font-weight: 700; margin-bottom: 12px; }
      .brand svg { width: 55px; height: 31px; color: #6257e8; }
      .tagline { margin-bottom: 28px; font-size: 13px; }
      .card { padding: 28px; border: 1px solid #ebe7ed; border-radius: 22px; background: #fff; }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { margin: 0 0 20px; color: #787484; line-height: 1.8; font-size: 14px; }
      button { appearance: none; border: 0; width: 100%; min-height: 48px; border-radius: 12px; background: #6257e8; color: #fff; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #6257e844; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" role="img" aria-label="AI记账">
        <svg viewBox="0 0 156 88" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 82C4 82 1 76 5 69L39 12C43 5 48 2 56 2H64C72 2 77 6 81 13L109 64C112 70 115 72 122 72V13C122 6 126 2 133 2H142C149 2 153 6 153 13V69C153 78 149 82 140 82H119C104 82 96 78 90 68L85 60H39L32 73C29 79 26 82 19 82H12ZM51 44H74L63 23L51 44Z" /></svg><span aria-hidden="true">记账</span>
      </div>
      <p class="tagline">让每一笔，都心里有数。</p>
      <section class="card" aria-labelledby="offline-title">
        <h1 id="offline-title">当前处于离线状态</h1>
        <p>网络恢复后就能继续记录生活。请检查网络连接，然后重试。</p>
        <button onclick="location.reload()">重新连接</button>
      </section>
    </main>
  </body>
</html>
